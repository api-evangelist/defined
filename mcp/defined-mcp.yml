generated: '2026-07-18'
method: searched
status: published
source: https://docs.codex.io/agents/docs-mcp.md
description: >-
  Codex (Defined's developer API) operates an official remote, hosted MCP server
  that lets AI coding tools search and reference the Codex GraphQL API
  documentation — queries, subscriptions, types and guides — to author and
  validate GraphQL queries without leaving the editor. It is a documentation MCP;
  it does not execute API calls (that requires the GraphQL endpoint or SDK with
  an API key). Install string and server URL captured verbatim from the Codex
  docs.
server:
  name: codex-docs
  transport: http
  url: https://docs.codex.io/mcp
  auth: none
install:
  claude_code: claude mcp add --transport http codex-docs https://docs.codex.io/mcp
  cursor: Add to MCP Settings (Cmd/Ctrl+Shift+P)
  vscode: Create .vscode/mcp.json in project root
  windsurf: Edit ~/.codeium/windsurf/mcp_config.json
  claude_desktop: Settings > Connectors > Add custom connector
tools:
  - name: documentation-search
    description: >-
      Search the Codex API documentation for queries, subscriptions, types and
      guides to help assistants write correct GraphQL queries.
related:
  agent_skill: skills/_index.yml
  llms_txt: llms/defined-llms.txt
