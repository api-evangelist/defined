apis:
- aid: defined:codex-graphql-api
  name: Codex GraphQL API
  description: >-
    Codex is Defined's unified GraphQL API for real-time blockchain data: token
    prices, OHLCV bars, trades, liquidity pools, holders, wallet analytics,
    prediction markets and launchpad data across 100+ EVM and non-EVM networks.
    Queries and mutations POST to https://graph.codex.io/graphql; subscriptions
    stream over WebSocket (graphql-ws) at wss://graph.codex.io/graphql. Auth is
    an API key passed in the Authorization header (no Bearer prefix); short-lived
    JWTs minted by createApiTokens use a Bearer prefix, and agents can pay
    per-request over HTTP 402 via the Machine Payments Protocol.
  humanURL: https://docs.codex.io/
  baseURL: https://graph.codex.io/graphql
