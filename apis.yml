aid: defined
name: Defined
description: >-
  Defined (defined.fi) is a real-time, multi-chain crypto trading terminal and
  blockchain-data company backed by Version One Ventures. The consumer product
  is a customizable "Boards" trading workspace covering tokens, perps,
  predictions, launchpads and smart-money wallet tracking across every major
  network. Defined's data is exposed to developers through Codex (codex.io), its
  industry-leading blockchain data API: a single GraphQL endpoint serving
  real-time token prices, OHLCV charts, trades, liquidity pools, holder
  balances, wallet analytics, launchpad activity and prediction-market data for
  70M+ tokens across 100+ EVM and non-EVM networks, used by Coinbase,
  TradingView, Uniswap and Magic Eden.
